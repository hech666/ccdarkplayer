name: Build CCDarkPlayer

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: Package scheme
        type: choice
        options: [rootless, roothide]
        default: rootless

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: ${{ github.event_name == 'workflow_dispatch' && inputs.scheme || 'rootless' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and install host tools
        run: |
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$THEOS_PACKAGE_SCHEME" == roothide ]]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Build Package
        shell: bash
        run: |
          set -euo pipefail
          sh build.sh "$THEOS_PACKAGE_SCHEME"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.THEOS_PACKAGE_SCHEME }}
          path: ./packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "控制中心深色播放器 v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
