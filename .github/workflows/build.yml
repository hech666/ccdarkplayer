name: Build CCDarkPlayer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${{ github.run_number }}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates dpkg xz-utils make
          sudo apt-get install -y libxml2-dev 2>/dev/null || \
            sudo apt-get install -y libxml2 || true

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install Swift Toolchain (Linux)
        run: |
          TOOLCHAIN_URL="https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-toolchain-linux.tar.xz"
          curl -L "$TOOLCHAIN_URL" -o swift-toolchain.tar.xz
          tar -xJf swift-toolchain.tar.xz -C "$THEOS"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -r "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install ldid
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_aarch64 -o /tmp/ldid 2>/dev/null || \
          curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Build Package
        run: |
          sh build.sh "${{ matrix.build_variant }}"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "控制中心深色播放器 v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
